# Erreurs Docker Compose. Les problèmes des fichiers Compose eux-mêmes sont analysés par
# le paquet compose ; ces entrées en fournissent le contenu pédagogique.
- id: compose.no-project
  category: compose
  applies: [compose]
  patterns:
    - 'no configuration file provided: not found'
  concept:
    name: Compose project
    definition: >-
      Un projet Compose est l'ensemble des services décrits dans un fichier compose.yaml. Le
      dossier qui contient ce fichier donne son nom au projet.
  summary: Aucun fichier Compose n'a été trouvé dans ce dossier.
  cause: >-
    La commande est lancée hors du dossier du projet, ou le fichier ne porte pas un nom
    reconnu (compose.yaml, compose.yml, docker-compose.yaml, docker-compose.yml).
  fixes:
    - description: Se placer dans le dossier du projet, ou indiquer le fichier avec « -f ».
      command: docker compose -f chemin/vers/compose.yaml {{.subcommand}}
      safe: true
    - description: Lister les projets Compose connus de Docker.
      command: docker compose ls
      safe: true
  deepen:
    explanation: >-
      « docker compose ps », « logs » ou « down » agissent sur le projet du dossier courant :
      le nom du projet vient du nom du dossier, sauf si tu le fixes avec « -p ».
    example: docker compose ls --all
    exercise: >-
      Dans un dossier « labo », crée un compose.yaml avec un service alpine, lance « docker
      compose up -d », puis lance « docker compose ps » depuis un autre dossier.
  doc_url: https://docs.docker.com/compose/
  tests: [compose-no-project-ps, compose-no-project-logs, compose-no-project-down]
