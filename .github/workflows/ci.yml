# Gates obligatoires du projet (principe IV de la constitution).
# Toutes les actions tierces sont épinglées par SHA de commit complet.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Appelé par release.yml : les mêmes gates sont rejouées sur le commit d'un tag de version.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          # Le binaire publié est compilé avec Go 1.26 et refuse un module en Go 1.27 :
          # compilation locale avec la chaîne d'outils du projet (voir LESSON-LEARNED LL-001).
          install-mode: goinstall

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Installer zsh (tests de l'intégration shell)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - name: Tests unitaires et de régression
        run: go test -race -cover ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique et tags complets : nécessaires à git describe.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Compiler avec la version issue du tag git
        # Sur un tag v0.1.0 : « 0.1.0 » ; après le tag : « 0.1.0-3-gabc1234 » ; sans tag :
        # le commit abrégé. La version est injectée par -ldflags (main.version).
        run: |
          version="$(git describe --tags --match 'v[0-9]*' --always --dirty)"
          version="${version#v}"
          echo "Version : ${version}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          go build -trimpath -ldflags "-X main.version=${version}" -o docker-telemach ./cmd/docker-telemach
      - name: Vérifier la version affichée
        run: |
          ./docker-telemach --version
          first_line="$(./docker-telemach --version | head -n 1)"
          if [ "${first_line}" != "TELEMACH PLUGIN DOCKER ${VERSION}" ]; then
            echo "::error::--version affiche « ${first_line} » au lieu de la version ${VERSION}"
            exit 1
          fi
          ./docker-telemach docker-cli-plugin-metadata | grep -F "\"Version\":\"${VERSION}\""

  goreleaser-check:
    # Configuration de publication valide et snapshot complet : 4 binaires, sommes, SBOM.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Installer Syft (SBOM)
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1
      - name: Rendre Syft accessible à GoReleaser
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: dirname "$SYFT" >> "$GITHUB_PATH"
      - name: Vérifier la configuration GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: check
      - name: Construire un snapshot (sans signature ni image)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --snapshot --clean --skip=sign,docker
      - name: Vérifier les artefacts contre le contrat (noms, sommes, SBOM, version, reproductibilité)
        env:
          DIST_DIR: dist
        run: go test -tags dist -count=1 ./tests/release/...

  image-scan:
    # Image construite à partir d'un snapshot, puis analysée par Grype (principe IV).
    # Trivy est écarté depuis la compromission de trivy-action (research R8).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Construire l'image snapshot (linux/amd64 et linux/arm64)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --snapshot --clean --skip=sign,sbom
      - name: Repérer l'image amd64
        id: image
        run: |
          version="$(jq -r .version dist/metadata.json)"
          echo "ref=docker.io/telemachlearning/telemach:${version}-amd64" >> "$GITHUB_OUTPUT"
      - name: Analyser l'image (vulnérabilités hautes et critiques bloquantes)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.image.outputs.ref }}
          grype-version: v0.120.1
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          output-format: table

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzzing du nettoyage, du masquage et du diagnostic
        run: |
          go test -run='^$' -fuzz=FuzzSanitize -fuzztime=30s ./internal/sanitize
          go test -run='^$' -fuzz=FuzzRedact -fuzztime=30s ./internal/redact
          go test -run='^$' -fuzz=FuzzDiagnose -fuzztime=30s ./internal/diagnose

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Scénarios du quickstart contre un vrai démon Docker
        run: go test -tags integration -count=1 ./tests/integration/...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        # Compilé avec la chaîne d'outils du projet (voir LESSON-LEARNED LL-001).
        env:
          GOTOOLCHAIN: go1.27.2
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installer gitleaks v8.30.1 (somme de contrôle vérifiée)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Recherche de secrets dans tout l'historique
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose .

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  dockerfile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer hadolint v2.15.1 (somme de contrôle vérifiée)
        run: |
          curl -sSfL -o hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  hadolint" | sha256sum -c -
          chmod +x hadolint
      - name: Lint des Dockerfile livrés (testdata/ exclu)
        run: |
          mapfile -t files < <(git ls-files -- '*Dockerfile' '*.Dockerfile' ':!:testdata/**')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Aucun Dockerfile livré : rien à vérifier."
            exit 0
          fi
          ./hadolint "${files[@]}"
