# Gates obligatoires du projet (principe IV de la constitution).
# Toutes les actions tierces sont épinglées par SHA de commit complet.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          # Le binaire publié est compilé avec Go 1.26 et refuse un module en Go 1.27 :
          # compilation locale avec la chaîne d'outils du projet (voir LESSON-LEARNED LL-001).
          install-mode: goinstall

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Installer zsh (tests de l'intégration shell)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - name: Tests unitaires et de régression
        run: go test -race -cover ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzzing du nettoyage, du masquage et du diagnostic
        run: |
          go test -run='^$' -fuzz=FuzzSanitize -fuzztime=30s ./internal/sanitize
          go test -run='^$' -fuzz=FuzzRedact -fuzztime=30s ./internal/redact
          go test -run='^$' -fuzz=FuzzDiagnose -fuzztime=30s ./internal/diagnose

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Scénarios du quickstart contre un vrai démon Docker
        run: go test -tags integration -count=1 ./tests/integration/...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        # Compilé avec la chaîne d'outils du projet (voir LESSON-LEARNED LL-001).
        env:
          GOTOOLCHAIN: go1.27.2
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installer gitleaks v8.30.1 (somme de contrôle vérifiée)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Recherche de secrets dans tout l'historique
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose .

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  dockerfile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer hadolint v2.15.1 (somme de contrôle vérifiée)
        run: |
          curl -sSfL -o hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  hadolint" | sha256sum -c -
          chmod +x hadolint
      - name: Lint des Dockerfile livrés (testdata/ exclu)
        run: |
          mapfile -t files < <(git ls-files -- '*Dockerfile' '*.Dockerfile' ':!:testdata/**')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Aucun Dockerfile livré : rien à vérifier."
            exit 0
          fi
          ./hadolint "${files[@]}"
