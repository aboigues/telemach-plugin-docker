# Publication d'une version (feature 002) : Release GitHub et image Docker Hub.
# Déclenchée par le push d'un tag vX.Y.Z, ou relancée à la main SUR le tag :
#   gh workflow run release.yml --ref vX.Y.Z
# (jamais depuis une branche : l'identité des signatures keyless serait celle de la branche).
# Toutes les actions tierces sont épinglées par SHA de commit complet.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # Contrôles préalables, en lecture seule, sans aucun secret.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Vérifier que la référence est un tag de version
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ ! "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::« $REF » n'est pas un tag de version vX.Y.Z : lance la publication sur un tag (gh workflow run release.yml --ref vX.Y.Z)."
            exit 1
          fi
          echo "Tag de version : ${REF#refs/tags/}"

  gates:
    # Les mêmes gates que pour une pull request, sur le commit du tag.
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: [verify, gates]
    runs-on: ubuntu-latest
    # Seul job qui écrit, et seul à pouvoir lire le secret Docker Hub (environnement protégé,
    # réservé aux tags v*).
    environment: release
    permissions:
      contents: write      # brouillon de Release, puis publication
      id-token: write      # signatures keyless (Sigstore)
      attestations: write  # provenance SLSA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Installer cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Installer Syft (SBOM)
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1
      - name: Rendre Syft accessible à GoReleaser
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: dirname "$SYFT" >> "$GITHUB_PATH"
      - name: Construire, signer et créer le brouillon de Release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --clean --skip=docker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attester la provenance des fichiers publiés (SLSA)
        # Sujets = chaque ligne de checksums.txt (nom publié + somme) : sur le disque, les
        # binaires portent le nom de compilation « docker-telemach », pas le nom publié.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
          create-storage-record: false
      - name: Publier la Release (immuable une fois publiée)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
