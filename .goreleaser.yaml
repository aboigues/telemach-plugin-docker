# Configuration GoReleaser OSS v2.18.3 — publication d'une version (feature 002).
# Contrats : specs/002-distribution/contracts/release-assets.md et image-tags.md.
version: 2

project_name: telemach-plugin-docker

builds:
  # Plugin Docker CLI, publié dans la Release et embarqué dans l'image.
  - id: docker-telemach
    main: ./cmd/docker-telemach
    binary: docker-telemach
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    # Mêmes options que la vérification de reproductibilité (tests/release).
    ldflags: ["-s -w -buildid= -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

  # Point d'entrée de l'image ; jamais publié dans la Release.
  - id: telemach-image
    main: ./cmd/telemach-image
    binary: telemach-image
    goos: [linux]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -buildid= -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # Binaires bruts, sans archive : un seul fichier à télécharger et à vérifier.
  - id: docker-telemach
    ids: [docker-telemach]
    formats: [binary]
    name_template: "docker-telemach_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: docker-telemach
    artifacts: binary
    ids: [docker-telemach]
    documents: ["{{ .ArtifactName }}.sbom.json"]

signs:
  # Signature keyless (Sigstore) du fichier de sommes : identité OIDC du workflow release.yml.
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

dockers_v2:
  - id: telemach
    ids: [docker-telemach, telemach-image]
    dockerfile: Dockerfile
    # dockers_v2 ne place dans le contexte que les binaires linux de la plateforme visée :
    # les binaires darwin (mêmes fichiers que dans la Release) y sont ajoutés depuis dist/.
    extra_files:
      - dist/docker-telemach_darwin_amd64_v1
      - dist/docker-telemach_darwin_arm64_v8.0
    images: [docker.io/telemachlearning/telemach]
    platforms: [linux/amd64, linux/arm64]
    # X.Y et latest seulement pour une version stable (contracts/image-tags.md).
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    sbom: true
    labels:
      org.opencontainers.image.title: TELEMACH
      org.opencontainers.image.description: Explique en français les erreurs Docker et Docker Compose ; installe le plugin docker telemach.
      org.opencontainers.image.source: https://github.com/aboigues/telemach-plugin-docker
      org.opencontainers.image.url: https://www.telemach-learning.fr
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"

release:
  # Brouillon : release.yml ajoute les attestations puis publie (releases immuables).
  draft: true
  replace_existing_draft: false
  prerelease: auto
  name_template: "TELEMACH {{ .Version }}"
  header: |
    ## Installer TELEMACH {{ .Version }}

    **Linux et WSL2**

    ```bash
    VERSION={{ .Version }}
    ARCH=$(uname -m); case "$ARCH" in x86_64) ARCH=amd64 ;; aarch64|arm64) ARCH=arm64 ;; esac
    FICHIER=docker-telemach_${VERSION}_linux_${ARCH}
    curl -fsSLO "https://github.com/aboigues/telemach-plugin-docker/releases/download/v${VERSION}/${FICHIER}"
    curl -fsSLO "https://github.com/aboigues/telemach-plugin-docker/releases/download/v${VERSION}/checksums.txt"
    sha256sum --check --ignore-missing checksums.txt
    mkdir -p ~/.docker/cli-plugins
    install -m 0755 "$FICHIER" ~/.docker/cli-plugins/docker-telemach
    docker telemach --version
    ```

    **macOS**

    ```bash
    VERSION={{ .Version }}
    ARCH=$(uname -m); case "$ARCH" in x86_64) ARCH=amd64 ;; aarch64|arm64) ARCH=arm64 ;; esac
    FICHIER=docker-telemach_${VERSION}_darwin_${ARCH}
    curl -fsSLO "https://github.com/aboigues/telemach-plugin-docker/releases/download/v${VERSION}/${FICHIER}"
    curl -fsSLO "https://github.com/aboigues/telemach-plugin-docker/releases/download/v${VERSION}/checksums.txt"
    shasum -a 256 --check --ignore-missing checksums.txt
    mkdir -p ~/.docker/cli-plugins
    install -m 0755 "$FICHIER" ~/.docker/cli-plugins/docker-telemach
    docker telemach --version
    ```

    **Avec Docker seulement** (Linux et WSL2 ; sur macOS, ajoute `-e HOST_OS=darwin`)

    ```bash
    mkdir -p ~/.docker/cli-plugins
    docker run --rm --user "$(id -u):$(id -g)" -v ~/.docker/cli-plugins:/sortie telemachlearning/telemach:{{ .Version }} install
    ```

    Active ensuite l'explication automatique des erreurs : `eval "$(docker telemach shell-init zsh)"`
    (ou `bash`) dans ton fichier de configuration du shell. Guide complet : [README](https://github.com/aboigues/telemach-plugin-docker#installation).
  footer: |
    ## Vérifier l'authenticité

    Signature du fichier de sommes (cosign v3) :

    ```bash
    curl -fsSLO "https://github.com/aboigues/telemach-plugin-docker/releases/download/v{{ .Version }}/checksums.txt.sigstore.json"
    cosign verify-blob \
      --bundle checksums.txt.sigstore.json \
      --certificate-identity-regexp '^https://github\.com/aboigues/telemach-plugin-docker/\.github/workflows/release\.yml@refs/tags/v' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      checksums.txt
    ```

    Provenance (SLSA) d'un binaire : `gh attestation verify <fichier> --repo aboigues/telemach-plugin-docker`

    TELEMACH est un logiciel libre sous licence Apache 2.0 — https://www.telemach-learning.fr

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^ci"
      - "^test"
  groups:
    - title: Nouveautés
      regexp: "^feat"
      order: 0
    - title: Corrections
      regexp: "^fix"
      order: 1
    - title: Autres changements
      order: 999
